# Tunable numbers for hazard and risk (docs/IMPLEMENTATION_PLAN.md section 3).
# Values that differ from the plan are explained in docs/decisions.md.

hazard:
  wind:
    # Modified Rankine vortex: V = Vmax * r / Rmax inside Rmax, Vmax * (Rmax / r)^alpha outside.
    # The plan's 0.5 puts tropical-storm-force wind ~510 km out; 0.7 gives ~240 km (decisions.md).
    alpha: 0.7
    inland_decay_factor: 0.85   # wind multiplier while the storm centre is far inland
    inland_decay_km: 10.0       # ... more than this far from the coast
    tropical_storm_force_mph: 39.0
  surge:
    decay_inland_km: 3.0        # L in exp(-d / L)
    imputation_neighbours: 5    # null elevation: median of this many nearest assets
  ensemble:
    members: 50
    sigma_cone_factor: 1.0      # sideways track shift ~ N(0, factor x cone radius at landfall)
    seed: 42                    # each advisory uses seed + advisory_no
  interpolation_step_hours: 1.0

risk:
  condition_theta_reduction_per_step: 0.075  # theta x (1 - 0.075 x (condition - 1)): up to -30 %
  stale_inspection_years: 3                  # older inspection -> confidence medium
  alert:
    risk_threshold: 7000                     # customer-equivalents
    top_n: 10
    rank_jump: 10                            # places risen since the previous advisory ...
    rank_jump_within: 25                     # ... counted only for assets ending in this top N

draft:
  top_assets: 10              # highest-risk assets the draft may mention
  template_top_assets: 5      # how many the template draft names
  retrieval_per_query: 2      # BM25 clauses kept per package item
  retrieval_max_clauses: 8
  max_tokens: 4000            # per model call
  retries: 1                  # after a draft fails citation validation

copilot:
  max_tool_rounds: 5          # model turns that may call tools before an answer is required
  history_turns: 6            # earlier messages sent back with a question
  top_risks_default: 5
  top_risks_max: 25           # the most list_top_risks returns
  search_results: 3           # clauses search_playbook returns
  max_tokens: 2000
  deadline_s: 60              # whole answer, across tool rounds
  history_max: 20             # earlier messages accepted with a question
