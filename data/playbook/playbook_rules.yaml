# Machine-readable triggers for docs/playbook.md (EOP-HUR-01 v3.2)
#
# FICTIONAL. Take-home challenge for the role of AI Solution Engineer (Zug).
# Not an official AECOM document. All thresholds are invented for a prototype.
#
# Semantics (implemented by backend/app/playbook/engine.py, see docs/IMPLEMENTATION_PLAN.md, M5):
#   - A rule is ACTIVE when event.hours_to_landfall <= active_from_hours
#     (active_from_hours: null means always active).
#   - For each entity in scope, the rule MATCHES when every predicate in `when` holds.
#   - A matched rule is SATISFIED when every predicate in `satisfied_if` holds, otherwise OPEN.
#   - kind: prohibition rules never become findings on their own. They BLOCK any open
#     rule with requires_field_work: true on the same entity. A blocked action becomes a
#     CONFLICT finding that cites both clauses and P-8.2, and is routed to the IC.
#   - The LLM never evaluates these rules. It only narrates findings and cites clause IDs.
#
# Predicate: {field, op, value} or {field, op, value_field}
#   ops: eq, ne, gt, ge, lt, le, in, contains_any, is_true, is_false
#   field namespaces: asset.*, exposure.*, state.*, staging.*, event.*  (see data model in the plan)

version: "3.2"
document_id: EOP-HUR-01
fictional: true

activation_levels:
  monitor: {from_hours: 120, to_hours: 72}   # Level 3, P-2.1
  prepare: {from_hours: 72, to_hours: 48}    # Level 2, P-2.2
  full: {from_hours: 48, to_hours: 0}        # Level 1, P-2.3

conflict_policy:
  clause: P-8.2
  rule: personnel_safety_prevails
  resolution: route_to_incident_commander     # tools flag, never resolve

rules:
  - id: P-4.1
    title: Risk list reviewed for this advisory
    kind: process
    entity: event
    active_from_hours: 72
    when: []
    satisfied_if:
      - {field: event.risk_list_reviewed_current, op: is_true}
    requires_field_work: false
    severity: medium
    owner_role: planning

  - id: P-4.2
    title: Pre-inspect coastal pumping stations at flood risk
    kind: action
    entity: asset
    active_from_hours: 48
    when:
      - {field: asset.type, op: eq, value: pump_station}
      - {field: asset.distance_to_coast_km, op: le, value: 5}
      - {field: exposure.flood_depth_p90_m, op: gt, value: 0.5}
    satisfied_if:
      - {field: state.inspection_completed, op: is_true}
    requires_field_work: true
    severity: high
    owner_role: operations

  - id: P-4.3
    title: Enough fuelled generators for critical-feeding top-25 assets
    kind: action
    entity: event
    active_from_hours: 72
    when: []
    satisfied_if:
      - {field: event.generators_fuelled, op: ge, value_field: event.wtp_pump_stations_top25}
    requires_field_work: false
    severity: high
    owner_role: logistics

  - id: P-4.4
    title: Inspect poor-condition substations in the top 10
    kind: action
    entity: asset
    active_from_hours: 72
    when:
      - {field: asset.type, op: eq, value: substation}
      - {field: asset.risk_rank, op: le, value: 10}
      - {field: asset.condition_score, op: ge, value: 4}
    satisfied_if:
      - {field: state.inspection_completed, op: is_true}
    requires_field_work: true
    severity: medium
    owner_role: operations

  - id: P-4.5
    title: Generator assigned to at-risk pumping stations serving the treatment plant
    kind: action
    entity: asset
    active_from_hours: 48
    when:
      - {field: asset.type, op: eq, value: pump_station}
      - {field: asset.feeds_facility_types, op: contains_any, value: [treatment_plant]}
      - {field: asset.p_fail, op: ge, value: 0.20}
    satisfied_if:
      - {field: state.generator_assigned, op: is_true}
    requires_field_work: true
    severity: high
    owner_role: logistics

  - id: P-4.6
    title: Leave staging areas forecast to flood
    kind: action
    entity: staging_area
    active_from_hours: 36
    when:
      - {field: staging.flood_depth_p90_m, op: gt, value: 0}
    satisfied_if:
      - {field: state.relocated, op: is_true}
    requires_field_work: false
    severity: high
    owner_role: logistics

  - id: P-4.7
    title: Stop work where tropical-storm-force wind arrives within 12 hours
    kind: prohibition
    entity: asset
    active_from_hours: null
    when:
      - {field: exposure.tsforce_arrival_h, op: le, value: 12}
    satisfied_if: []
    requires_field_work: false
    severity: critical
    owner_role: operations

  - id: P-5.1
    title: Flood barriers at substations
    kind: action
    entity: asset
    active_from_hours: 36
    when:
      - {field: asset.type, op: eq, value: substation}
      - {field: exposure.flood_depth_p90_m, op: gt, value: 0.3}
    satisfied_if:
      - {field: state.barrier_installed, op: is_true}
    requires_field_work: true
    severity: high
    owner_role: logistics

  - id: P-5.2
    title: Backup power and remote monitoring at flood-exposed pumping stations
    kind: action
    entity: asset
    active_from_hours: 48
    when:
      - {field: asset.type, op: eq, value: pump_station}
      - {field: exposure.flood_depth_p90_m, op: gt, value: 0.5}
    satisfied_if:
      - {field: state.backup_power_confirmed, op: is_true}
    requires_field_work: false
    severity: high
    owner_role: operations

  - id: P-5.3
    title: Treatment plant chemicals and boil-water notice ready
    kind: action
    entity: asset
    active_from_hours: 48
    when:
      - {field: asset.type, op: eq, value: treatment_plant}
      - {field: asset.p_fail, op: ge, value: 0.10}
    satisfied_if:
      - {field: state.chem_stock_confirmed, op: is_true}
      - {field: state.boil_water_notice_ready, op: is_true}
    requires_field_work: false
    severity: high
    owner_role: operations

  - id: P-6.2
    title: Contact hospitals that depend on top-25 assets
    kind: notification
    entity: asset
    active_from_hours: 48
    when:
      - {field: asset.feeds_facility_types, op: contains_any, value: [hospital]}
      - {field: asset.risk_rank, op: le, value: 25}
    satisfied_if:
      - {field: state.critical_customer_contacted, op: is_true}
    requires_field_work: false
    severity: medium
    owner_role: regulatory_liaison

  - id: P-7.1
    title: Situation report approved for this operational period
    kind: process
    entity: event
    active_from_hours: 72
    when: []
    satisfied_if:
      - {field: event.sitrep_approved_current, op: is_true}
    requires_field_work: false
    severity: medium
    owner_role: planning

  - id: P-7.2
    title: Regulator notified within 12 hours of full activation
    kind: notification
    entity: event
    active_from_hours: 48
    when:
      - {field: event.activation_level, op: eq, value: full}
    satisfied_if:
      - {field: event.regulator_notified, op: is_true}
    deadline:
      field: event.hours_since_full_activation
      within_hours: 12          # open and overdue after this -> severity escalates to critical
    requires_field_work: false
    severity: high
    owner_role: regulatory_liaison

# Clauses retrieved for context only (no machine trigger):
